
<!DOCTYPE html>
<html>

<head>
    <title>Time Table</title>
</head>

<body>

<table border="1" width="100%" cellspacing="0">

    <tr bgcolor="pink">
        <th>Time/Day</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
    </tr>

    <tr>
        <th>10:00-11:00</th>
        <th>DBMS</th>
        <th>Maths</th>
        <th>DBMS</th>
        <th>DBMS</th>
    </tr>

    <tr>
        <th>11:00-12:00</th>
        <th>WT</th>
        <th>DBMS</th>
        <th>WT</th>
        <th>Maths</th>
    </tr>

    <tr>
        <th>12:00-12:30</th>
        <th colspan="4" bgcolor="yellow" align="center">
            <b>LUNCH</b>
        </th>
    </tr>

    <tr>
        <th>12:30-1:30</th>
        <th>Maths</th>
        <th rowspan="2">DBMSL (PR) T1 Batch</th>
        <th>Maths</th>
        <th rowspan="2">DBMSL (PR) T2 Batch</th>
    </tr>

    <tr>
        <th>1:30-2:30</th>
        <th>WT</th>
        <th>DBMS</th>
    </tr>

</table>

</body>
</html>
